---
name: Clean up old images
on:
  schedule:
    - cron: '30 11 * * 0'  # Sundays
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Keeps the last 30 builds for `bootc switch <tag>` rollbacks; cosign signatures of
      # deleted images go with them (delete-orphaned-images)
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: niri-image
          keep-n-tagged: 30
          exclude-tags: latest
          delete-untagged: true
          delete-orphaned-images: true
          # dry-run: true  # set to only log what would be deleted
