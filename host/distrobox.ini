# Native build toolchain + -devel libs. Create with: distrobox assemble create --file host/distrobox.ini
# nvm/sdkman/rustup/go stay in $HOME and work from both host and box.
[dev]
image=registry.fedoraproject.org/fedora-toolbox:44
additional_packages="gcc gcc-c++ make cmake meson ninja-build autoconf automake bison flex pkgconf ccache"
additional_packages="gdb valgrind ltrace perf"
additional_packages="SDL3-devel sdl2-compat-devel mesa-libGL-devel mesa-libGLU-devel lz4-devel xxhash-devel"
additional_packages="mingw64-SDL3 mingw64-sdl2-compat"
additional_packages="python3-devel subversion doxygen"
